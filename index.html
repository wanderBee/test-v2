<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <span class="badge">wanderBee/test-v2</span>
    <h1>GitHub Workflow Demo</h1>
    <p>用一个最小项目演示 Branch → Commit → Pull Request → Review → Merge。</p>

    <button id="actionBtn">创建一次 Demo 交互</button>
    <p id="result" class="result">等待操作…</p>

    <section>
      <h2>推荐练习</h2>
      <ol>
        <li>创建一个 feature 分支</li>
        <li>修改页面标题</li>
        <li>提交并 Push</li>
        <li>创建 Pull Request</li>
        <li>通过 CI 后合并</li>
      </ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
